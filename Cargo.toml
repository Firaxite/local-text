[package]
name = "local-text"
version = "0.1.0"
edition = "2021"

[features]
logging = []

[dependencies]
winit      = "0.30"
fontdue    = "0.9"
ropey      = "1.6"
vte        = "0.13"
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chacha20poly1305 = "0.10"
rand             = "0.8"
base64           = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2             = "0.6"
objc2-foundation  = { version = "0.3", features = ["NSDictionary", "NSValue", "NSObject", "NSString", "alloc"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CATransaction", "CAMetalLayer"] }
objc2-io-surface  = { version = "0.3" }
objc2-metal       = { version = "0.3", features = ["MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLBlitCommandEncoder", "MTLDevice", "MTLDrawable", "MTLPixelFormat", "MTLResource", "MTLTexture"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
softbuffer = "0.4"

[profile.release]
strip = true
