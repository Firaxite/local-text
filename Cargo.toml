[package]
name = "local-text"
version = "0.1.0"
edition = "2021"

[dependencies]
winit   = "0.30"
fontdue = "0.9"
ropey   = "1.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2             = "0.6"
objc2-foundation  = { version = "0.3", features = ["NSDictionary", "NSValue", "NSObject", "NSString", "alloc"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CATransaction"] }
objc2-io-surface  = { version = "0.3" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
softbuffer = "0.4"

[profile.release]
strip = true
