[package]
name = "local-text"
version = "0.1.0"
edition = "2021"

[features]
logging = []

[dependencies]
winit      = "0.30"
fontdue    = "0.9"
ropey      = "1.6"
vte        = "0.13"
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chacha20poly1305 = "0.10"
rand             = "0.8"
base64           = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2             = "0.6"
objc2-foundation  = { version = "0.3", features = ["NSDictionary", "NSValue", "NSObject", "NSString", "alloc"] }
objc2-quartz-core = { version = "0.3", features = ["CALayer", "CATransaction", "CAMetalLayer"] }
objc2-io-surface  = { version = "0.3" }
objc2-metal       = { version = "0.3", features = ["MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLBlitCommandEncoder", "MTLDevice", "MTLDrawable", "MTLPixelFormat", "MTLResource", "MTLTexture"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
softbuffer = "0.4"
# System clipboard (X11, plus Wayland compositors with data-control, and Windows);
# macOS uses pbcopy/pbpaste.
arboard    = { version = "3.7", default-features = false, features = ["wayland-data-control"] }

# Windows: ConPTY terminals, native file/message dialogs, process liveness,
# ShellExecute (MIT/Apache-2.0; already pulled in by winit).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
strip = true
